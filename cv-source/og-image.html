<!DOCTYPE html>
<!-- Source for public/og-image.png (1200x630 social preview). -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, "Segoe UI", sans-serif; color: #e8ebf0;
    background:
      radial-gradient(700px 420px at 90% -10%, rgba(34,211,238,.22), transparent 60%),
      radial-gradient(600px 380px at -5% 110%, rgba(52,211,153,.18), transparent 60%),
      #07090d;
    display: flex; align-items: center; gap: 64px; padding: 0 80px; box-sizing: border-box;
  }
  .grid { position: absolute; inset: 0; background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 56px 56px; }
  .copy { position: relative; flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.18); font-size: 20px; font-weight: 500; color: #cfd5de; }
  .pill i { width: 10px; height: 10px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 6px rgba(52,211,153,.18); }
  h1 { margin: 28px 0 0; font-size: 82px; line-height: 1; letter-spacing: -3px; font-weight: 800; }
  h2 { margin: 16px 0 0; font-size: 40px; font-weight: 700; letter-spacing: -1px;
    background: linear-gradient(120deg,#34d399,#22d3ee); -webkit-background-clip: text; color: transparent; }
  p { margin: 26px 0 0; font: 600 21px "JetBrains Mono", monospace; color: #8e97a6; }
  .photo { position: relative; width: 320px; height: 400px; border-radius: 30px; padding: 4px;
    background: linear-gradient(160deg,#34d399,rgba(255,255,255,.08) 45%,#22d3ee);
    box-shadow: 0 40px 100px -30px rgba(34,211,238,.45); }
  .photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 26px; display: block; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="copy">
    <span class="pill"><i></i>Technical Lead @ Palm Outsourcing</span>
    <h1>Ibrahim Gaber</h1>
    <h2>AI &amp; Full Stack Engineer</h2>
    <p>Claude agents · Node.js · TypeScript · Next.js</p>
  </div>
  <div class="photo"><img src="../src/images/personal image 3-cropped.jpg" alt="" /></div>
</body>
</html>
